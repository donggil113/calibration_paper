[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibration-cliff"
version = "0.1.0"
description = "Calibration Cliff: cross-national transfer of ECG foundation models degrades calibration, not discrimination."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dong-Gil Kang", email = "dgkang77@pusan.ac.kr"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
ecg = ["wfdb>=4.1", "h5py>=3.9"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
all = ["torch>=2.0", "wfdb>=4.1", "h5py>=3.9", "pytest>=7.4", "ruff>=0.4"]

[project.scripts]
recalib = "recalib_kit.cli:main"
ecgcal = "ecgcal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
